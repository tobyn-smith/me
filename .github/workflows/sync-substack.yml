name: Sync Substack posts

# Keeps the site's Substack section in step with what has actually been
# published, so it never quietly falls behind. Runs weekly, and can be
# triggered by hand from the Actions tab at any time.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh featured posts from the RSS feed
        run: python3 .github/scripts/sync_substack.py

      - name: Commit if the posts changed
        run: |
          if [ -z "$(git status --porcelain data.js)" ]; then
            echo "Nothing to do — data.js already matches the feed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Update featured Substack posts from RSS feed"
          git push
