name: Sync project sites

# Rebuilds the two project subsites from their source repos and vendors them
# into this repo as /usagrid and /baltic. GitHub Pages can only serve one
# repository per custom domain, so the built output lives here as subdirectories
# rather than being mapped from the source repos directly.
#
# - energyosint: the published site is committed in its docs/ directory, so it
#   is copied verbatim.
# - transit: the site is rendered with Quarto in CI (it is not committed), so it
#   is rebuilt here exactly like its own publish.yml does.
#
# Both sites are then rewritten from their github.io URLs to the canonical
# tobynsmith.me paths, and Quarto's render timestamps are stripped from the
# sitemap so unchanged content does not produce noisy commits.

on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Attach to main branch
        run: |
          git fetch origin main
          git checkout -B main origin/main

      # ---- energyosint: committed site in docs/ ----
      - name: Checkout energyosint
        uses: actions/checkout@v4
        with:
          repository: tobyn-smith/energyosint
          path: .sync-src/energyosint

      - name: Copy energyosint site
        run: |
          rm -rf usagrid
          mkdir -p usagrid
          cp -a .sync-src/energyosint/docs/. usagrid/
          grep -rIlF 'tobyn-smith.github.io/energyosint' usagrid \
            | xargs -r sed -i 's|tobyn-smith.github.io/energyosint|tobynsmith.me/usagrid|g'

      # ---- transit: render with Quarto, then copy ----
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::sf
            any::dplyr
            any::readr
            any::ggplot2
            any::leaflet
            any::rnaturalearth
            any::rnaturalearthdata
            any::scales
            any::gt
            any::reactable
            any::ggrepel
            any::jsonlite

      - name: Checkout transit
        uses: actions/checkout@v4
        with:
          repository: tobyn-smith/transit
          path: .sync-src/transit

      - name: Render transit site
        working-directory: .sync-src/transit
        run: quarto render

      - name: Copy transit site
        run: |
          rm -rf baltic
          mkdir -p baltic
          cp -a .sync-src/transit/docs/. baltic/
          grep -rIlF 'tobyn-smith.github.io/transit' baltic \
            | xargs -r sed -i 's|tobyn-smith.github.io/transit|tobynsmith.me/baltic|g'
          # Drop render timestamps so identical content yields an empty diff.
          sed -i 's|<lastmod>[^<]*</lastmod>||g' baltic/sitemap.xml

      - name: Commit and push
        run: |
          rm -rf .sync-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usagrid baltic
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync project sites from source repos"
            git push origin main
          fi
